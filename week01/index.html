<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Week 1 Starter — Canvas &amp; Clear Color</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <script>
    const canvas = document.getElementById("gl-canvas");
    const gl = canvas.getContext("webgl2");

    if (!gl) {
      throw new Error("WebGL2 is not available on this device/browser.");
    }

    function resizeCanvasToDisplaySize() {
      const dpr = window.devicePixelRatio || 1;
      const width = Math.round(canvas.clientWidth * dpr);
      const height = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    let colorChangeCount = 0;

    const colorChange = setInterval(() => {
        currentColor = [
            Math.random(),
            Math.random(),
            Math.random(),
            1.0
        ];
        render();
        console.log(currentColor);

        colorChangeCount++;
        if(colorChangeCount >= 3){
            clearInterval(colorChange);
        }
    }, 1000);

    function render() {
      resizeCanvasToDisplaySize();
      gl.viewport(0, 0, canvas.width, canvas.height);

      // TODO(student): try changing these values
      gl.clearColor(currentColor[0], currentColor[1], currentColor[2], currentColor[3]);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }

    window.addEventListener("resize", render);
    render();
  </script>
</body>
</html>
